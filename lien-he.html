<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên Hệ & Đặt Lịch - SPA H&D</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="flex flex-col min-h-screen">

  <header class="spa-header sticky top-0 z-50 text-white shadow-md">
    <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
      <a href="index.html" class="flex items-center gap-3">
        <img src="logo.jpg" alt="Logo SPA H&D" class="h-12 w-12 rounded-full object-cover border-2 border-[#8c5a2b]">
        <span class="text-2xl font-bold text-white brand-font">SPA H&D</span>
      </a>
      <nav class="hidden md:flex space-x-8 font-medium text-sm text-[#f0e2d5]">
        <a href="index.html" class="hover:text-white">Trang chủ</a>
        <a href="gioi-thieu.html" class="hover:text-white">Giới thiệu</a>
        <a href="dich-vu.html" class="hover:text-white">Dịch vụ</a>
        <a href="bang-gia.html" class="hover:text-white">Bảng giá</a>
        <a href="khach-hang.html" class="hover:text-white">Khách hàng</a>
        <a href="tin-tuc.html" class="hover:text-white">Tin tức</a>
        <a href="lien-he.html" class="text-white font-bold border-b-2 border-[#d4a373] pb-1">Liên hệ</a>
      </nav>
      <a href="dat-lich.html" class="hidden sm:inline-block btn-primary px-6 py-2.5 rounded-full text-sm">Đặt Lịch Hẹn</a>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-12 flex-grow">
    <div class="bg-white rounded-2xl p-8 shadow-sm border border-[#8c5a2b]/20">
      <h1 class="text-3xl font-bold text-[#5a3825] brand-font text-center mb-2">ĐẶT LỊCH HẸN TRỰC TUYẾN</h1>
      <p class="text-center text-gray-600 mb-8 text-sm">Hãy điền thông tin bên dưới, SPA H&D sẽ xác nhận trong 5 phút!</p>

      <form id="bookingForm" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label for="fullname" class="block text-xs font-bold uppercase tracking-wider text-[#5a3825] mb-2">Họ và tên *</label>
            <input type="text" id="fullname" placeholder="Nguyễn Văn A" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#8c5a2b] text-sm">
          </div>
          <div>
            <label for="phone" class="block text-xs font-bold uppercase tracking-wider text-[#5a3825] mb-2">Số điện thoại *</label>
            <input type="tel" id="phone" placeholder="0901234567" class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#8c5a2b] text-sm">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#5a3825] mb-3">Chọn dịch vụ *</label>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-sm">
            <label class="flex items-center p-3 border rounded-xl cursor-pointer hover:bg-[#fdfaf7]">
              <input type="radio" name="service" value="Gội đầu dưỡng sinh" class="accent-[#8c5a2b]">
              <span class="ml2 text-gray-800 font-medium ml-2">Gội đầu dưỡng sinh</span>
            </label>
            <label class="flex items-center p-3 border rounded-xl cursor-pointer hover:bg-[#fdfaf7]">
              <input type="radio" name="service" value="Chăm sóc da mặt" class="accent-[#8c5a2b]">
              <span class="ml-2 text-gray-800 font-medium">Chăm sóc da mặt</span>
            </label>
            <label class="flex items-center p-3 border rounded-xl cursor-pointer hover:bg-[#fdfaf7]">
              <input type="radio" name="service" value="Massage chân & Chà gót" class="accent-[#8c5a2b]">
              <span class="ml-2 text-gray-800 font-medium">Massage chân & Chà gót</span>
            </label>
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-[#5a3825] mb-3">Dịch vụ bổ sung</label>
          <div class="flex flex-wrap gap-4 text-sm">
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" name="extra" value="Soi da" class="rounded accent-[#8c5a2b]">
              <span class="ml-2 text-gray-700">Soi da miễn phí</span>
            </label>
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" name="extra" value="Tư vấn Skincare" class="rounded accent-[#8c5a2b]">
              <span class="ml-2 text-gray-700">Tư vấn Skincare cá nhân</span>
            </label>
          </div>
        </div>

        <div>
          <label for="note" class="block text-xs font-bold uppercase tracking-wider text-[#5a3825] mb-2">Ghi chú thêm</label>
          <textarea id="note" rows="3" placeholder="Yêu cầu giờ hẹn cụ thể..." class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-[#8c5a2b] text-sm"></textarea>
        </div>

        <button type="submit" class="w-full btn-primary font-bold py-3.5 rounded-xl shadow-lg uppercase tracking-wider text-sm">
          XÁC NHẬN ĐẶT LỊCH HẸN
        </button>
      </form>
    </div>
  </main>

  <footer class="bg-[#3e2518] text-[#e8d5c4] py-6 text-center text-xs mt-auto">
    &copy; 2026 SPA H&D. All rights reserved.
  </footer>
  <script src="js/main.js"></script>
</body>
</html>
